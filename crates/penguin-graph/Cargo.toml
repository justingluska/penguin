[package]
name = "penguin-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
penguin-core.workspace = true
penguin-provider.workspace = true
penguin-render.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Same HTTP stack as penguin-gmail (no new tree).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
# auth: PKCE, state, loopback redirect parsing; attachment upload bodies
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
futures-util = "0.3"
# receivedDateTime → unix ms (same features as penguin-gmail)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
penguin-provider = { workspace = true, features = ["fake"] }
