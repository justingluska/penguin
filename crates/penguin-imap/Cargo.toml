[package]
name = "penguin-imap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
penguin-core.workspace = true
penguin-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
futures-util = "0.3"
# TLS for IMAP and SMTP: rustls with ring (no OpenSSL, no aws-lc build),
# certificates checked by the OS verifier (macOS trust settings). Same
# versions as reqwest's in the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# MIME: same versions as penguin-gmail / penguin-provider
mail-parser = "0.11"
encoding_rs = "0.8"
base64 = "0.22"
sha2 = "0.10"
fastrand = "2"
# COMPRESS=DEFLATE (RFC 4978): raw DEFLATE both ways; already in the tree
# through reqwest's gzip.
flate2 = "1"
# INTERNALDATE parsing and IMAP SEARCH dates (same features as penguin-core)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
penguin-provider = { workspace = true, features = ["fake"] }
