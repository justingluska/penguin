[package]
name = "penguin-pair"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Pair iPhone: the Mac hands its Google accounts to the phone over the local network, end-to-end encrypted with a key bound to a one-time QR code (docs/PAIRING.md)."

# The protocol is sans-IO: both sides are plain state machines over byte
# frames, so the phone can carry them over Network.framework while the Mac
# (and the tests) use tokio sockets through the `tokio` feature.
[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.3"
hkdf = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
zeroize = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
