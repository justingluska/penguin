<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Penguin — Tuxedo post</title>
  <desc id="desc">A friendly ink penguin whose white belly folds into an envelope, on a pale ice app tile.</desc>
  <defs>
    <linearGradient id="ice" x1="256" y1="100" x2="768" y2="924" gradientUnits="userSpaceOnUse"><stop stop-color="#f3f8fb"/><stop offset="1" stop-color="#c8dae8"/></linearGradient>
    <linearGradient id="ink" x1="360" y1="248" x2="690" y2="770" gradientUnits="userSpaceOnUse"><stop stop-color="#283646"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <linearGradient id="paper" x1="512" y1="350" x2="512" y2="732" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf3f7"/></linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#030912" flood-opacity=".19"/></filter>
    <filter id="lift" x="190" y="200" width="644" height="650" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#23364b" flood-opacity=".16"/></filter>
  </defs>
  <!-- 824px continuous-corner tile, 100px clear canvas margin. -->
  <path d="M316 100H708C852 100 924 172 924 316V708C924 852 852 924 708 924H316C172 924 100 852 100 708V316C100 172 172 100 316 100Z" fill="url(#ice)" filter="url(#tile-shadow)"/>
