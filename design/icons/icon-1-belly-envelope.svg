    <circle cx="430" cy="423" r="22" fill="#111c28"/><circle cx="594" cy="423" r="22" fill="#111c28"/>
    <path d="M480 469Q512 458 544 469L518 503Q512 510 506 503Z" fill="#f5ad4f"/>
