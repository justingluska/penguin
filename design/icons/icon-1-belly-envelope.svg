  <g filter="url(#lift)">
    <path d="M406 747C374 747 351 766 360 785C369 800 424 801 455 784L470 754Z M618 747C650 747 673 766 664 785C655 800 600 801 569 784L554 754Z" fill="#f5ad4f"/>
