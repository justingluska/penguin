<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Penguin — Happy mail</title>
  <desc id="desc">The triangular flap of a white envelope is a penguin face, framed by a deep ink app tile.</desc>
