    <linearGradient id="tile" x1="235" y1="100" x2="770" y2="924" gradientUnits="userSpaceOnUse"><stop stop-color="#253242"/><stop offset=".52" stop-color="#1b2634"/><stop offset="1" stop-color="#121c28"/></linearGradient>
